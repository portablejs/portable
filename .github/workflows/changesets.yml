# Releases with Changesets, as the wevm repos do. On each push to main, the checks in verify.yml run first. Then the
# changesets job opens or updates a "Version packages" pull request while changesets are pending. Merging that pull
# request leaves none, so the release job publishes every package whose version isn't on npm yet and creates a GitHub
# release for each.
#
# npm trusted publishing (OIDC) authenticates the publish, so the repository holds no npm token, and npm adds a
# provenance attestation to each version. A trusted publisher on npm checks the repository, the workflow filename, and
# the environment. Only the environment check limits which branch can publish. Anyone with push access could edit this
# file on a branch to run on that push, but npm rejects a publish from a job without the `npm` environment, and GitHub
# runs jobs in that environment only from main.
#
# The changesets job can push to the repository and open pull requests, but gets no OIDC token. The release job holds
# the token, runs no tests, installs without lifecycle scripts, and uses no dependency cache, so while it holds the
# token, it runs only the build and the code that the build loads from the lockfile's dependencies. npm can only add a
# trusted publisher to a package that already exists, so `pnpm reserve` publishes a placeholder of each new package
# first, and the release job waits for the `NPM_TRUSTED_PUBLISHING` repository variable.
name: Changesets

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  changesets:
    name: Changesets
    needs: verify
    if: github.repository == 'portablejs/portable'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # commit the version bumps and changelogs to the pull request branch
      pull-requests: write # open or update the "Version packages" pull request
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # @changesets/changelog-github reads the history to link each changeset's commit and pull request.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          check-latest: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: changesets
        # Without `publish-script`, this only versions: it opens or updates the pull request while changesets are
        # pending. It commits through the GitHub API, so the checkout needs no stored credentials.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          version-script: pnpm changeset:version

  release:
    name: Release
    needs: [verify, changesets]
    if: >-
      github.repository == 'portablejs/portable' &&
      needs.changesets.outputs.has-changesets == 'false' &&
      vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/org/portable
    permissions:
      contents: write # create the release tags and GitHub releases
      id-token: write # authenticate to npm through trusted publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          check-latest: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # `changeset publish` writes each published package to the file in `CHANGESETS_OUTPUT`, which the action sets, and
      # the action creates a tag and a GitHub release for each one through the GitHub API, so the checkout needs no stored
      # credentials.
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm changeset:publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'

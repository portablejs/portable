# Publishes a preview of the docs site to here.now for each pull request, and records it as a GitHub deployment so
# the pull request shows a "View deployment" link. Every pull request deploys to the one `site preview` environment, so
# the repository's Deployments list shows one entry for all previews instead of one per pull request.
#
# Previews are anonymous here.now sites, which expire 24 hours after they are created. The site's slug and claim
# token are kept in the Actions cache, which only this pull request's runs can read, so later pushes update the same
# site until it is about to expire.
#
# Actions minutes are billed, so the job runs only on pull requests with the `preview` label. Adding the label
# publishes a preview, and each later push updates it. On other pull requests the job is skipped, which uses no
# minutes.
name: Site preview

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  deployments: write

concurrency:
  group: site-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Pull requests from forks get a read-only token, so they can't create deployments.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @portable/site build

      - uses: actions/cache/restore@v6
        with:
          path: site/.herenow.json
          key: site-preview-${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: site-preview-${{ github.event.pull_request.number }}-
      - id: publish
        working-directory: site
        run: node scripts/herenow.mjs .herenow.json
      - uses: actions/cache/save@v6
        with:
          path: site/.herenow.json
          key: site-preview-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/github-script@v9
        env:
          URL: ${{ steps.publish.outputs.url }}
        with:
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'site preview',
              description: 'Docs preview on here.now',
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
            })
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: process.env.URL,
              // GitHub marks earlier deployments in the environment inactive by default, which would hide the
              // preview links of other open pull requests.
              auto_inactive: false,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

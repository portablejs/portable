packages:
  - packages/*
  - packages/*/test
  - tools/*

catalog:
  '@changesets/changelog-github': ^1.0.1
  '@changesets/cli': ^3.0.3
  '@vitest/browser-playwright': 5.0.5
  '@vitest/coverage-v8': 5.0.5
  playwright: ^1.64.1
  split2: ^4.2.0
  typescript: ^6.0.3
  vite-plus: 1.3.0
  zile: ^0.0.30

# No dependency younger than a day, and no publish that drops provenance.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@voidzero-dev/*'
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - vite-plus
  - zile
trustPolicy: no-downgrade

linkWorkspacePackages: true
autoInstallPeers: false

# workerd ships its binary in an optional dependency, so its postinstall only checks for it.
allowBuilds:
  workerd: false

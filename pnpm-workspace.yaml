packages:
  - packages/*
  - packages/*/test
  - tools/*
  - site

catalog:
  '@changesets/changelog-github': ^1.0.1
  '@changesets/cli': ^3.0.3
  '@vitest/browser-playwright': 5.0.5
  '@vitest/coverage-v8': 5.0.5
  playwright: ^1.64.1
  split2: ^4.2.0
  typescript: ^6.0.3
  vite-plus: 1.3.0
  zile: ^0.0.30

# No dependency younger than a day, and no publish that drops provenance.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@voidzero-dev/*'
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - vite-plus
  - zile
trustPolicy: no-downgrade
# vocs depends on semver 6 through @babel/core, and semver 6.3.1 was published without provenance,
# so `trustPolicy: no-downgrade` would reject it.
trustPolicyExclude:
  - semver@6.3.1

linkWorkspacePackages: true
autoInstallPeers: false

# None of these install scripts is needed. workerd and esbuild ship their binaries in optional
# dependencies, so their postinstalls only check that the binary is there. es5-ext's postinstall
# only prints a message. vue-demi's postinstall picks Vue 2 or 3 for the API playground in vocs,
# which the site doesn't use.
allowBuilds:
  es5-ext: false
  esbuild: false
  vue-demi: false
  workerd: false

# miniflare pins undici and sharp, oxfmt under zile pins tinypool, and mailauth and smtp-server pin
# nodemailer, at versions with security advisories. These raise each one to its next patched
# release in the same major.
overrides:
  nodemailer@10: ^10.2.1
  sharp@0.35: ^0.35.5
  tinypool@2: ^2.2.0
  undici@7: ^7.30.1
  undici@8: ^8.12.3
